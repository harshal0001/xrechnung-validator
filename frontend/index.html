<!doctype html>
<html lang="de" translate="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <!-- This page ships its own translations and switches them with the DE/EN
         control. Left to itself, Chrome sees lang="de", offers to translate, and
         renders a machine translation on top of the real one — mixing the two
         and producing nonsense like "verletzt BR-DE-15" as "BR-DE-15 injured".
         Opting out is what keeps the language the reader chose the one they get. -->
    <meta name="google" content="notranslate" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Public Sans is the typeface of the US government design system: drawn for
         dense civic forms, legible at small sizes, no personality it has not
         earned. For a compliance tool that is a reason, not a preference.
         IBM Plex Mono carries every technical identifier. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Public+Sans:ital,wght@0,400;0,500;0,700;1,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <title>XRechnung prüfen</title>
    <meta
      name="description"
      content="Prüft deutsche E-Rechnungen (XRechnung, ZUGFeRD, UBL, UN/CEFACT CII) gegen EN 16931 und den KoSIT-Regelsatz und erklärt jeden Fehler im Klartext."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Pasted into a chat, a post or a portfolio page, a link with no card is a
         bare URL nobody clicks. The image is the product's own output — one real
         finding, rendered the way the page renders it — rather than a logo. -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="de_DE" />
    <meta property="og:title" content="XRechnung-Validator" />
    <meta
      property="og:description"
      content="Prüft deutsche E-Rechnungen gegen den amtlichen Regelsatz und erklärt jeden Fehler im Klartext."
    />
    <meta property="og:url" content="https://cbb6tgp2x1.execute-api.eu-central-1.amazonaws.com/" />
    <meta property="og:image" content="https://cbb6tgp2x1.execute-api.eu-central-1.amazonaws.com/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="XRechnung-Validator: BR-DE-15 — Die Käuferreferenz (BT-10) fehlt." />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
