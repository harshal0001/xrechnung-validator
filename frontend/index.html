<!doctype html>
<html lang="de" translate="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <!-- This page ships its own translations and switches them with the DE/EN
         control. Left to itself, Chrome sees lang="de", offers to translate, and
         renders a machine translation on top of the real one — mixing the two
         and producing nonsense like "verletzt BR-DE-15" as "BR-DE-15 injured".
         Opting out is what keeps the language the reader chose the one they get. -->
    <meta name="google" content="notranslate" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- IBM Plex Sans for text and IBM Plex Mono for technical identifiers: one
         family, drawn together, so the two sit on the same proportions and the
         mono reads as a register of the text rather than a second voice. Plex
         Sans is quiet at small sizes and its umlauts are properly drawn. -->
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <!-- Applies a stored light/dark choice before the first paint. Done in the
         stylesheet alone, a reader who chose dark would see a white flash on
         every load. src/theme.ts keeps it in step afterwards. -->
    <script>
      try {
        var theme = localStorage.getItem("xrv-theme");
        if (theme === "light" || theme === "dark") {
          document.documentElement.setAttribute("data-theme", theme);
        }
      } catch (e) {}
    </script>
    <title>XRechnung prüfen</title>
    <meta
      name="description"
      content="Prüft deutsche E-Rechnungen (XRechnung, ZUGFeRD, UBL, UN/CEFACT CII) gegen EN 16931 und den KoSIT-Regelsatz und erklärt jeden Fehler im Klartext."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Pasted into a chat, a post or a portfolio page, a link with no card is a
         bare URL nobody clicks. The image is the product's own output — one real
         finding, rendered the way the page renders it — rather than a logo. -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="de_DE" />
    <meta property="og:title" content="XRechnung-Validator" />
    <meta
      property="og:description"
      content="Prüft deutsche E-Rechnungen gegen den amtlichen Regelsatz und erklärt jeden Fehler im Klartext."
    />
    <meta property="og:url" content="https://xrechnung.harshalkothari.tech/" />
    <meta property="og:image" content="https://xrechnung.harshalkothari.tech/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="XRechnung-Validator: BR-DE-15 — Die Käuferreferenz (BT-10) fehlt." />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
