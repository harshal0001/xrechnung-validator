# Dependency updates arrive as pull requests, once a week, grouped so a routine
# week is one PR per ecosystem rather than ten. Nothing merges on its own: CI
# runs the suite against each, and a person merges.
#
# The KoSIT rule set is deliberately not here. It is data, versioned under
# rulesets/, and a new release is adopted by a reviewed change, never by a bot.
version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      python:
        patterns: ["*"]

  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    groups:
      frontend:
        patterns: ["*"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
