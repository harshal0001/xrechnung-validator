name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A second push to a PR makes the first run irrelevant. Cancel it rather than
# queueing behind it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned, not "latest". CI resolving to whatever KoSIT published this morning
  # would mean a green build says nothing about the commit that produced it.
  # Bumping this is a deliberate commit, reviewed like any other.
  RULESET_VERSION: "2026-08-31"

permissions:
  contents: read

jobs:
  check:
    name: lint, types, tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.5.11"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --all-extras

      # Not cached. The archive is 500 KB, and actions/cache only writes on a
      # primary-key miss — so a cache holding a bad ruleset is permanent, and a
      # fetch step gated on cache-hit never gets the chance to repair it. That
      # is not a hypothetical: it is how this workflow failed twice. The script
      # is idempotent and checks completeness itself, so let it decide.
      # --testsuite brings the reference messages too. The integration tests need
      # them, and XRV_REQUIRE_RULESET below turns a missing corpus into a failure
      # rather than a skip.
      - name: Fetch KoSIT ruleset and test suite
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: uv run python scripts/fetch_ruleset.py --version "$RULESET_VERSION" --testsuite

      - name: Lint
        run: uv run ruff check src tests scripts

      - name: Format
        run: uv run ruff format --check src tests scripts

      - name: Type check
        run: uv run mypy src/xrv

      # The catalogue is data, and data drifts. --check fails on an explanation
      # written against rule text the current rule set no longer has.
      - name: Explanation catalogues
        run: |
          for lang in de en; do
            uv run python scripts/review_sheet.py --check \
              --ruleset "rulesets/$RULESET_VERSION" \
              --explanations "explanations/$RULESET_VERSION.$lang.json" \
              --out "/tmp/review.$lang.md"
          done

      # XRV_REQUIRE_RULESET turns the "no ruleset fetched" skip into a failure.
      # That skip is right on a clean checkout and wrong here: a silent skip
      # would hide the ruleset drift the guard exists to catch.
      - name: Tests
        env:
          XRV_REQUIRE_RULESET: "1"
        run: uv run pytest --strict-markers --cov --cov-report=term

      # The floor is in pyproject.toml. Reported after the tests rather than as
      # part of them so a failure says which of the two it was.
      - name: Coverage
        run: uv run coverage report

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build

  # The page, driven in a browser against the service that serves it. The
  # service is started here from source with the built frontend beside it,
  # which is what the container does too, minus the container.
  browser:
    name: browser
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.5.11"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --all-extras

      - name: Fetch KoSIT ruleset
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: uv run python scripts/fetch_ruleset.py --version "$RULESET_VERSION"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build the page
        working-directory: frontend
        run: npm ci && npm run build

      - name: Install the browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Start the service
        run: |
          uv run uvicorn xrv.api:app --host 127.0.0.1 --port 8080 &
          for attempt in $(seq 1 60); do
            curl -sf http://127.0.0.1:8080/healthz | grep -q '"warm":true' && exit 0
            sleep 1
          done
          echo "the service did not become ready"; exit 1

      - name: Browser tests
        working-directory: frontend
        run: npm run e2e

      - name: Keep the traces of a failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7

  image:
    name: docker build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      # The Dockerfile bakes the ruleset in and verifies it, so the image cannot
      # build without one. Uncached, for the reason given in the check job.
      - name: Fetch KoSIT ruleset
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/fetch_ruleset.py --version "$RULESET_VERSION"

      # Only needed for the arm64 build on main. Cheap enough to always set up.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      # arm64 is what keeps Lambda Graviton on the table, but it builds under
      # emulation and is slow. Every PR proves amd64; pushes to main also prove
      # arm64, which is where a dependency losing its arm64 wheel would show up.
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ github.event_name == 'push' && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Deploying happens here rather than from a laptop, so what is live is always
  # a commit that passed everything above. No AWS key is stored: GitHub signs a
  # short-lived OIDC token and AWS exchanges it for temporary credentials, and
  # the role it assumes may push one image and update one function, nothing else.
  # Set it up with deploy/github-oidc.sh.
  deploy:
    name: deploy
    needs: [check, frontend, browser, image]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write        # required to mint the OIDC token
    concurrency:
      group: deploy-production
      cancel-in-progress: false   # never abandon a half-finished rollout
    env:
      AWS_REGION: eu-central-1
      NAME: xrechnung-validator
      ENDPOINT: https://xrechnung.harshalkothari.tech
    steps:
      - uses: actions/checkout@v4

      # Same as the image job: the Dockerfile bakes the ruleset in and verifies
      # it, so the build cannot run without one in the context.
      - name: Fetch KoSIT ruleset
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/fetch_ruleset.py --version "$RULESET_VERSION"

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: eu-central-1

      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      # provenance and sbom off, oci-mediatypes off: with them on, buildx pushes
      # an OCI manifest list and Lambda rejects the image with "media type ... is
      # not supported" — after the build and the push have both succeeded.
      - name: Build and push arm64
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          provenance: false
          sbom: false
          outputs: type=image,name=${{ steps.ecr.outputs.registry }}/xrechnung-validator:${{ github.sha }},push=true,oci-mediatypes=false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Addressed by commit sha, not :latest, so the function records which
      # commit is live and a rollback is one call with an older sha.
      - name: Point the function at it
        run: |
          aws lambda update-function-code --function-name "$NAME" \
            --image-uri "${{ steps.ecr.outputs.registry }}/xrechnung-validator:${{ github.sha }}" >/dev/null
          aws lambda wait function-updated --function-name "$NAME"

      # A deploy that reports success without the service answering is worse
      # than a failed one, because nobody looks again.
      - name: Prove it is serving
        run: |
          for attempt in 1 2 3 4 5 6; do
            body=$(curl -fsS --max-time 30 "$ENDPOINT/healthz") && break
            echo "attempt $attempt: not answering yet"; sleep 10
          done
          echo "$body"
          echo "$body" | grep -q '"status":"ok"'
          curl -fsS --max-time 60 -F file=@frontend/public/samples/missing-buyer-reference.xml \
            "$ENDPOINT/validate?explain=true&lang=de" | grep -q 'BR-DE-15'
          echo "live: $ENDPOINT"
